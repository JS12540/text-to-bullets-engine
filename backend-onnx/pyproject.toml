[project]
name = "text-to-bullets-backend-onnx"
version = "0.1.0"
description = "ONNX conversion + accuracy validation for the text-to-bullets T5 model"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.110.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.26.0",
    "tokenizers>=0.20.0",
    "uvicorn>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
