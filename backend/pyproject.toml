[project]
name = "text-to-bullets-backend"
version = "0.1.0"
description = "Backend inference server for text-to-bullets T5 model"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "torch>=2.1.0",
    "torchao>=0.3.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "sentencepiece>=0.2.0",
    "pydantic>=2.5.0",
    "safetensors>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
